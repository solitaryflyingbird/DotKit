<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>clean_cut_one_touch — multiply-to-alpha 원터치 변환기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body { height: 100%; background: #1a1a1a; color: #ddd; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 13px; }
body { display: flex; flex-direction: column; overflow: hidden; }

#toolbar {
  padding: 8px 12px; background: #252525; border-bottom: 1px solid #333;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
#toolbar button {
  background: #333; color: #ddd; border: 1px solid #444;
  padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 13px;
}
#toolbar button:hover:not(:disabled) { background: #404040; }
#toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
#toolbar input[type=file] { color: #ddd; font-size: 12px; max-width: 220px; }
#toolbar input[type=range] { width: 100px; }
#toolbar select {
  background: #333; color: #ddd; border: 1px solid #444;
  padding: 5px 8px; border-radius: 4px; font-size: 13px; cursor: pointer;
}
#toolbar .group {
  display: flex; gap: 8px; align-items: center;
  padding: 0 10px; border-right: 1px solid #333;
}
#toolbar .group:last-child { border-right: none; }
.label { font-size: 11px; color: #888; }
.value { font-size: 11px; color: #aaa; min-width: 32px; text-align: right; }
input[type=color] {
  width: 32px; height: 28px; border: 1px solid #444; border-radius: 4px;
  background: none; cursor: pointer; padding: 0;
}
#runBtn { background: #2d7a3e; border-color: #3a8a4e; color: #fff; }
#runBtn:hover:not(:disabled) { background: #36904a; }
.hint { font-size: 11px; color: #666; margin-left: auto; }
.badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: #2a3a4a; color: #8ab4e8; border: 1px solid #3a4a5a;
}

#workspace {
  flex: 1; display: flex; gap: 1px; background: #0a0a0a; min-height: 0;
}
.pane {
  flex: 1; position: relative; overflow: hidden;
  background: #0f0f0f; min-width: 0; display: flex; flex-direction: column;
}
.pane-header {
  position: absolute; top: 8px; left: 8px; z-index: 10;
  background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px;
  font-size: 11px; color: #888; pointer-events: none;
}
.viewport {
  flex: 1; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.checkerboard {
  background-image:
    linear-gradient(45deg, #1f1f1f 25%, transparent 25%),
    linear-gradient(-45deg, #1f1f1f 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #1f1f1f 75%),
    linear-gradient(-45deg, transparent 75%, #1f1f1f 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  background-color: #141414;
}
.bg-toggle {
  background: #fff; background-image: none;
}
.viewport canvas {
  max-width: 100%; max-height: 100%;
  image-rendering: pixelated;
  display: block;
}
.empty {
  color: #555; font-size: 14px; text-align: center;
}
.empty .big {
  font-size: 32px; margin-bottom: 8px; color: #444;
}
#dropOverlay {
  position: absolute; inset: 0; background: rgba(74,144,226,0.15);
  border: 3px dashed #4a90e2; display: none;
  align-items: center; justify-content: center; pointer-events: none;
  z-index: 100; color: #4a90e2; font-size: 18px; font-weight: 600;
}
#dropOverlay.show { display: flex; }

.pane-actions {
  padding: 8px 12px; background: #252525; border-top: 1px solid #333;
  display: flex; gap: 8px; align-items: center;
}

#statusBar {
  padding: 6px 12px; background: #1f1f1f; border-top: 1px solid #333;
  font-size: 11px; color: #888; display: flex; gap: 16px;
}
#statusBar .err { color: #e88; }
#statusBar .ok { color: #8e8; }
</style>
</head>
<body>

<div id="toolbar">
  <div class="group">
    <input type="file" id="fileInput" accept="image/*">
    <button id="runBtn" disabled>변환</button>
  </div>

  <div class="group">
    <span class="label">모드</span>
    <select id="modeSelect">
      <option value="auto">auto</option>
      <option value="grayscale">grayscale</option>
      <option value="tint">tint</option>
      <option value="color">color</option>
    </select>
    <span class="badge" id="detectedBadge" style="display:none"></span>
  </div>

  <div class="group">
    <span class="label">tint</span>
    <input type="color" id="tintColor" value="#000000">
    <span class="label">배경</span>
    <input type="color" id="bgColor" value="#ffffff">
  </div>

  <div class="group">
    <span class="label">노이즈컷</span>
    <input type="range" id="threshold" min="0" max="50" value="4">
    <span class="value" id="thresholdVal">0.004</span>
  </div>

  <div class="group">
    <button id="bgToggleBtn">배경 흰색</button>
    <button id="downloadBtn" disabled>PNG 저장</button>
  </div>

  <span class="hint">파일을 끌어다 놓거나 선택 후 '변환'을 누르세요</span>
</div>

<div id="workspace">
  <div class="pane">
    <div class="pane-header">원본</div>
    <div class="viewport" id="srcViewport">
      <div class="empty" id="srcEmpty">
        <div class="big">+</div>
        이미지를 드래그하거나 위에서 선택
      </div>
      <canvas id="srcCanvas" style="display:none"></canvas>
    </div>
    <div id="dropOverlay">이미지를 놓으세요</div>
  </div>

  <div class="pane">
    <div class="pane-header">결과 (multiply→alpha)</div>
    <div class="viewport checkerboard" id="dstViewport">
      <div class="empty" id="dstEmpty">변환 결과가 여기에 표시됩니다</div>
      <canvas id="dstCanvas" style="display:none"></canvas>
    </div>
  </div>
</div>

<div id="statusBar">
  <span id="statusMsg">준비됨.</span>
  <span id="dimsMsg"></span>
  <span id="modeMsg"></span>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const runBtn = document.getElementById('runBtn');
const downloadBtn = document.getElementById('downloadBtn');
const bgToggleBtn = document.getElementById('bgToggleBtn');
const modeSelect = document.getElementById('modeSelect');
const tintColor = document.getElementById('tintColor');
const bgColor = document.getElementById('bgColor');
const threshold = document.getElementById('threshold');
const thresholdVal = document.getElementById('thresholdVal');
const detectedBadge = document.getElementById('detectedBadge');

const srcCanvas = document.getElementById('srcCanvas');
const dstCanvas = document.getElementById('dstCanvas');
const srcEmpty = document.getElementById('srcEmpty');
const dstEmpty = document.getElementById('dstEmpty');
const dstViewport = document.getElementById('dstViewport');
const dropOverlay = document.getElementById('dropOverlay');

const statusMsg = document.getElementById('statusMsg');
const dimsMsg = document.getElementById('dimsMsg');
const modeMsg = document.getElementById('modeMsg');

let currentImageBlob = null;
let currentImageDataUrl = null;
let resultBlobUrl = null;

function setStatus(msg, kind = '') {
  statusMsg.textContent = msg;
  statusMsg.className = kind;
}

function updateThresholdLabel() {
  const v = (parseInt(threshold.value, 10) / 1000).toFixed(3);
  thresholdVal.textContent = v;
}
threshold.addEventListener('input', updateThresholdLabel);
updateThresholdLabel();

function loadImageFromFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    setStatus('이미지 파일이 아닙니다', 'err');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    currentImageDataUrl = e.target.result;
    currentImageBlob = file;
    const img = new Image();
    img.onload = () => {
      srcCanvas.width = img.naturalWidth;
      srcCanvas.height = img.naturalHeight;
      const ctx = srcCanvas.getContext('2d');
      ctx.clearRect(0, 0, img.naturalWidth, img.naturalHeight);
      ctx.drawImage(img, 0, 0);
      srcCanvas.style.display = 'block';
      srcEmpty.style.display = 'none';
      dimsMsg.textContent = `${img.naturalWidth} × ${img.naturalHeight}`;
      runBtn.disabled = false;
      setStatus(`로드 완료: ${file.name}`, 'ok');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) loadImageFromFile(e.target.files[0]);
});

// 드래그앤드롭
document.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropOverlay.classList.add('show');
});
document.addEventListener('dragleave', (e) => {
  if (e.target === document.documentElement || e.relatedTarget === null) {
    dropOverlay.classList.remove('show');
  }
});
document.addEventListener('drop', (e) => {
  e.preventDefault();
  dropOverlay.classList.remove('show');
  if (e.dataTransfer.files[0]) {
    loadImageFromFile(e.dataTransfer.files[0]);
  }
});

// 붙여넣기
document.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) {
    const file = item.getAsFile();
    if (file) loadImageFromFile(file);
  }
});

async function runProcess() {
  if (!currentImageDataUrl) return;
  runBtn.disabled = true;
  setStatus('변환 중...');

  const payload = {
    image: currentImageDataUrl,
    mode: modeSelect.value,
    tint_color: tintColor.value,
    bg_color: bgColor.value,
    threshold: parseInt(threshold.value, 10) / 1000,
  };

  try {
    const res = await fetch('/process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText);
    }
    const detected = res.headers.get('X-Detected-Mode');
    if (detected && modeSelect.value === 'auto') {
      detectedBadge.textContent = `auto → ${detected}`;
      detectedBadge.style.display = 'inline-block';
    } else {
      detectedBadge.style.display = 'none';
    }
    const blob = await res.blob();
    if (resultBlobUrl) URL.revokeObjectURL(resultBlobUrl);
    resultBlobUrl = URL.createObjectURL(blob);

    const img = new Image();
    img.onload = () => {
      dstCanvas.width = img.naturalWidth;
      dstCanvas.height = img.naturalHeight;
      const ctx = dstCanvas.getContext('2d');
      ctx.clearRect(0, 0, img.naturalWidth, img.naturalHeight);
      ctx.drawImage(img, 0, 0);
      dstCanvas.style.display = 'block';
      dstEmpty.style.display = 'none';
      downloadBtn.disabled = false;
      setStatus('완료', 'ok');
      modeMsg.textContent = detected ? `모드: ${detected}` : '';
    };
    img.src = resultBlobUrl;
  } catch (err) {
    setStatus('오류: ' + err.message, 'err');
  } finally {
    runBtn.disabled = false;
  }
}

runBtn.addEventListener('click', runProcess);

downloadBtn.addEventListener('click', () => {
  if (!resultBlobUrl) return;
  const a = document.createElement('a');
  a.href = resultBlobUrl;
  const base = currentImageBlob ? currentImageBlob.name.replace(/\.[^.]+$/, '') : 'output';
  a.download = `${base}_alpha.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

let bgIsCheckerboard = true;
bgToggleBtn.addEventListener('click', () => {
  bgIsCheckerboard = !bgIsCheckerboard;
  dstViewport.classList.toggle('checkerboard', bgIsCheckerboard);
  dstViewport.classList.toggle('bg-toggle', !bgIsCheckerboard);
  bgToggleBtn.textContent = bgIsCheckerboard ? '배경 흰색' : '배경 체커보드';
});

// 모드 변경 시 자동 재실행
modeSelect.addEventListener('change', () => {
  if (currentImageDataUrl && !runBtn.disabled) runProcess();
});
[tintColor, bgColor].forEach(el => {
  el.addEventListener('change', () => {
    if (currentImageDataUrl && !runBtn.disabled) runProcess();
  });
});
threshold.addEventListener('change', () => {
  if (currentImageDataUrl && !runBtn.disabled) runProcess();
});
</script>
</body>
</html>
