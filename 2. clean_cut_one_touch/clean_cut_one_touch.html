<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>clean_cut_one_touch (standalone) — multiply-to-alpha</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body { height: 100%; background: #1a1a1a; color: #ddd; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 13px; }
body { display: flex; flex-direction: column; overflow: hidden; }

#toolbar {
  padding: 8px 12px; background: #252525; border-bottom: 1px solid #333;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
#toolbar button {
  background: #333; color: #ddd; border: 1px solid #444;
  padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 13px;
}
#toolbar button:hover:not(:disabled) { background: #404040; }
#toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
#toolbar input[type=file] { color: #ddd; font-size: 12px; max-width: 220px; }
#toolbar input[type=range] { width: 100px; }
#toolbar select {
  background: #333; color: #ddd; border: 1px solid #444;
  padding: 5px 8px; border-radius: 4px; font-size: 13px; cursor: pointer;
}
#toolbar .group {
  display: flex; gap: 8px; align-items: center;
  padding: 0 10px; border-right: 1px solid #333;
}
#toolbar .group:last-child { border-right: none; }
.label { font-size: 11px; color: #888; }
.value { font-size: 11px; color: #aaa; min-width: 32px; text-align: right; }
input[type=color] {
  width: 32px; height: 28px; border: 1px solid #444; border-radius: 4px;
  background: none; cursor: pointer; padding: 0;
}
#runBtn { background: #2d7a3e; border-color: #3a8a4e; color: #fff; }
#runBtn:hover:not(:disabled) { background: #36904a; }
.hint { font-size: 11px; color: #666; margin-left: auto; }
.badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: #2a3a4a; color: #8ab4e8; border: 1px solid #3a4a5a;
}

#workspace {
  flex: 1; display: flex; gap: 1px; background: #0a0a0a; min-height: 0;
}
.pane {
  flex: 1; position: relative; overflow: hidden;
  background: #0f0f0f; min-width: 0; display: flex; flex-direction: column;
}
.pane-header {
  position: absolute; top: 8px; left: 8px; z-index: 10;
  background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px;
  font-size: 11px; color: #888; pointer-events: none;
}
.viewport {
  flex: 1; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.checkerboard {
  background-image:
    linear-gradient(45deg, #1f1f1f 25%, transparent 25%),
    linear-gradient(-45deg, #1f1f1f 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #1f1f1f 75%),
    linear-gradient(-45deg, transparent 75%, #1f1f1f 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  background-color: #141414;
}
.bg-white { background: #fff; background-image: none; }
.bg-black { background: #000; background-image: none; }
.viewport canvas {
  max-width: 100%; max-height: 100%;
  image-rendering: pixelated;
  display: block;
}
.empty {
  color: #555; font-size: 14px; text-align: center;
}
.empty .big {
  font-size: 32px; margin-bottom: 8px; color: #444;
}
#dropOverlay {
  position: absolute; inset: 0; background: rgba(74,144,226,0.15);
  border: 3px dashed #4a90e2; display: none;
  align-items: center; justify-content: center; pointer-events: none;
  z-index: 100; color: #4a90e2; font-size: 18px; font-weight: 600;
}
#dropOverlay.show { display: flex; }

#statusBar {
  padding: 6px 12px; background: #1f1f1f; border-top: 1px solid #333;
  font-size: 11px; color: #888; display: flex; gap: 16px;
}
#statusBar .err { color: #e88; }
#statusBar .ok { color: #8e8; }
</style>
</head>
<body>

<div id="toolbar">
  <div class="group">
    <input type="file" id="fileInput" accept="image/*">
    <button id="runBtn" disabled>변환</button>
  </div>

  <div class="group">
    <span class="label">모드</span>
    <select id="modeSelect">
      <option value="auto">auto</option>
      <option value="grayscale">grayscale</option>
      <option value="tint">tint</option>
      <option value="color">color</option>
    </select>
    <span class="badge" id="detectedBadge" style="display:none"></span>
  </div>

  <div class="group">
    <span class="label">tint</span>
    <input type="color" id="tintColor" value="#000000">
    <span class="label">배경</span>
    <input type="color" id="bgColor" value="#ffffff">
  </div>

  <div class="group">
    <span class="label">노이즈컷</span>
    <input type="range" id="threshold" min="0" max="50" value="4">
    <span class="value" id="thresholdVal">0.004</span>
  </div>

  <div class="group">
    <button id="bgToggleBtn">배경: 체커보드</button>
    <button id="downloadBtn" disabled>PNG 저장</button>
  </div>

  <span class="hint">서버 없이 동작 — 파일을 끌어다 놓거나 선택</span>
</div>

<div id="workspace">
  <div class="pane">
    <div class="pane-header">원본</div>
    <div class="viewport" id="srcViewport">
      <div class="empty" id="srcEmpty">
        <div class="big">+</div>
        이미지를 드래그하거나 위에서 선택
      </div>
      <canvas id="srcCanvas" style="display:none"></canvas>
    </div>
    <div id="dropOverlay">이미지를 놓으세요</div>
  </div>

  <div class="pane">
    <div class="pane-header">결과 (multiply→alpha)</div>
    <div class="viewport checkerboard" id="dstViewport">
      <div class="empty" id="dstEmpty">변환 결과가 여기에 표시됩니다</div>
      <canvas id="dstCanvas" style="display:none"></canvas>
    </div>
  </div>
</div>

<div id="statusBar">
  <span id="statusMsg">준비됨.</span>
  <span id="dimsMsg"></span>
  <span id="modeMsg"></span>
  <span id="timeMsg"></span>
</div>

<script>
// ============================================================
// 핵심 알고리즘 — Python clean_cut_one_touch.py 와 동일 로직
// ============================================================

function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
  if (!m) return [0, 0, 0];
  return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
}

function autoDetectMode(data, w, h, satThreshold = 0.05, ratio = 0.95) {
  // 채도 히스토그램으로 grayscale vs color 자동 판별
  let nonWhite = 0;
  let lowSat = 0;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    if (max < 0.98) {
      nonWhite++;
      const sat = max > 1e-6 ? (max - min) / max : 0;
      if (sat < satThreshold) lowSat++;
    }
  }
  if (nonWhite === 0) return 'grayscale';
  return (lowSat / nonWhite) >= ratio ? 'grayscale' : 'color';
}

function multiplyToAlpha(srcData, w, h, opts) {
  // srcData: ImageData.data (RGBA, Uint8ClampedArray)
  // opts: { mode, tintColor[r,g,b], bgColor[r,g,b], threshold }
  const out = new Uint8ClampedArray(w * h * 4);
  const [br, bgg, bb] = opts.bgColor;
  const [tr, tg, tbl] = opts.tintColor;
  const th = opts.threshold;
  const mode = opts.mode;

  // 정규화 분모
  const dr = 255 - br;
  const dg = 255 - bgg;
  const db = 255 - bb;

  for (let i = 0; i < srcData.length; i += 4) {
    let R = srcData[i];
    let G = srcData[i + 1];
    let B = srcData[i + 2];
    const A_in = srcData[i + 3] / 255;

    // 입력 RGBA를 흰 배경 flatten — alpha < 1이면 흰 배경 위에 합성된 값으로 간주
    if (A_in < 1) {
      R = R * A_in + 255 * (1 - A_in);
      G = G * A_in + 255 * (1 - A_in);
      B = B * A_in + 255 * (1 - A_in);
    }

    // 배경색 정규화 (0~1)
    let rf, gf, bf;
    if (dr < 1) rf = Math.min(1, Math.max(0, R / 255));
    else        rf = Math.min(1, Math.max(0, (R - br) / dr));
    if (dg < 1) gf = Math.min(1, Math.max(0, G / 255));
    else        gf = Math.min(1, Math.max(0, (G - bgg) / dg));
    if (db < 1) bf = Math.min(1, Math.max(0, B / 255));
    else        bf = Math.min(1, Math.max(0, (B - bb) / db));

    let alpha, rOut, gOut, bOut;

    if (mode === 'grayscale' || mode === 'tint') {
      const lum = 0.299 * rf + 0.587 * gf + 0.114 * bf;
      alpha = 1 - lum;
      rOut = tr / 255;
      gOut = tg / 255;
      bOut = tbl / 255;
    } else {
      // color
      const minCh = Math.min(rf, gf, bf);
      alpha = 1 - minCh;
      const safe = alpha > th ? alpha : 1;
      rOut = 1 - (1 - rf) / safe;
      gOut = 1 - (1 - gf) / safe;
      bOut = 1 - (1 - bf) / safe;
    }

    // 노이즈 컷
    if (alpha < th) {
      out[i] = 0; out[i + 1] = 0; out[i + 2] = 0; out[i + 3] = 0;
      continue;
    }

    out[i]     = Math.max(0, Math.min(255, Math.round(rOut * 255)));
    out[i + 1] = Math.max(0, Math.min(255, Math.round(gOut * 255)));
    out[i + 2] = Math.max(0, Math.min(255, Math.round(bOut * 255)));
    out[i + 3] = Math.max(0, Math.min(255, Math.round(alpha * 255)));
  }

  return out;
}

// ============================================================
// UI
// ============================================================

const fileInput = document.getElementById('fileInput');
const runBtn = document.getElementById('runBtn');
const downloadBtn = document.getElementById('downloadBtn');
const bgToggleBtn = document.getElementById('bgToggleBtn');
const modeSelect = document.getElementById('modeSelect');
const tintColor = document.getElementById('tintColor');
const bgColor = document.getElementById('bgColor');
const threshold = document.getElementById('threshold');
const thresholdVal = document.getElementById('thresholdVal');
const detectedBadge = document.getElementById('detectedBadge');

const srcCanvas = document.getElementById('srcCanvas');
const dstCanvas = document.getElementById('dstCanvas');
const srcEmpty = document.getElementById('srcEmpty');
const dstEmpty = document.getElementById('dstEmpty');
const dstViewport = document.getElementById('dstViewport');
const dropOverlay = document.getElementById('dropOverlay');

const statusMsg = document.getElementById('statusMsg');
const dimsMsg = document.getElementById('dimsMsg');
const modeMsg = document.getElementById('modeMsg');
const timeMsg = document.getElementById('timeMsg');

let currentFileName = 'output';

function setStatus(msg, kind = '') {
  statusMsg.textContent = msg;
  statusMsg.className = kind;
}

function updateThresholdLabel() {
  const v = (parseInt(threshold.value, 10) / 1000).toFixed(3);
  thresholdVal.textContent = v;
}
threshold.addEventListener('input', updateThresholdLabel);
updateThresholdLabel();

function loadImageFromFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    setStatus('이미지 파일이 아닙니다', 'err');
    return;
  }
  currentFileName = file.name.replace(/\.[^.]+$/, '') || 'output';
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      srcCanvas.width = img.naturalWidth;
      srcCanvas.height = img.naturalHeight;
      const ctx = srcCanvas.getContext('2d', { willReadFrequently: true });
      ctx.clearRect(0, 0, img.naturalWidth, img.naturalHeight);
      ctx.drawImage(img, 0, 0);
      srcCanvas.style.display = 'block';
      srcEmpty.style.display = 'none';
      dimsMsg.textContent = `${img.naturalWidth} × ${img.naturalHeight}`;
      runBtn.disabled = false;
      setStatus(`로드 완료: ${file.name}`, 'ok');
      runProcess();
    };
    img.onerror = () => setStatus('이미지 디코드 실패', 'err');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) loadImageFromFile(e.target.files[0]);
});

document.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropOverlay.classList.add('show');
});
document.addEventListener('dragleave', (e) => {
  if (e.target === document.documentElement || e.relatedTarget === null) {
    dropOverlay.classList.remove('show');
  }
});
document.addEventListener('drop', (e) => {
  e.preventDefault();
  dropOverlay.classList.remove('show');
  if (e.dataTransfer.files[0]) loadImageFromFile(e.dataTransfer.files[0]);
});

document.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) {
    const file = item.getAsFile();
    if (file) loadImageFromFile(file);
  }
});

function runProcess() {
  if (srcCanvas.width === 0) return;
  setStatus('변환 중...');
  runBtn.disabled = true;

  // 다음 프레임에서 실제 처리 — UI 업데이트가 먼저 그려지도록
  requestAnimationFrame(() => {
    try {
      const t0 = performance.now();
      const w = srcCanvas.width, h = srcCanvas.height;
      const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
      const srcImageData = srcCtx.getImageData(0, 0, w, h);

      let mode = modeSelect.value;
      let detected = mode;
      if (mode === 'auto') {
        detected = autoDetectMode(srcImageData.data, w, h);
      }

      const opts = {
        mode: detected,
        tintColor: hexToRgb(tintColor.value),
        bgColor: hexToRgb(bgColor.value),
        threshold: parseInt(threshold.value, 10) / 1000,
      };

      const outData = multiplyToAlpha(srcImageData.data, w, h, opts);
      const outImageData = new ImageData(outData, w, h);

      dstCanvas.width = w;
      dstCanvas.height = h;
      const dstCtx = dstCanvas.getContext('2d');
      dstCtx.putImageData(outImageData, 0, 0);
      dstCanvas.style.display = 'block';
      dstEmpty.style.display = 'none';
      downloadBtn.disabled = false;

      const dt = (performance.now() - t0).toFixed(1);
      setStatus('완료', 'ok');
      timeMsg.textContent = `${dt} ms`;

      if (modeSelect.value === 'auto') {
        detectedBadge.textContent = `auto → ${detected}`;
        detectedBadge.style.display = 'inline-block';
      } else {
        detectedBadge.style.display = 'none';
      }
      modeMsg.textContent = `모드: ${detected}`;
    } catch (err) {
      setStatus('오류: ' + err.message, 'err');
    } finally {
      runBtn.disabled = false;
    }
  });
}

runBtn.addEventListener('click', runProcess);

downloadBtn.addEventListener('click', () => {
  dstCanvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${currentFileName}_alpha.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
});

const bgStates = ['checkerboard', 'bg-white', 'bg-black'];
const bgLabels = ['체커보드', '흰색', '검정'];
let bgIdx = 0;
bgToggleBtn.addEventListener('click', () => {
  dstViewport.classList.remove(bgStates[bgIdx]);
  bgIdx = (bgIdx + 1) % bgStates.length;
  dstViewport.classList.add(bgStates[bgIdx]);
  bgToggleBtn.textContent = `배경: ${bgLabels[bgIdx]}`;
});

[modeSelect, tintColor, bgColor].forEach(el => {
  el.addEventListener('change', () => {
    if (srcCanvas.width > 0) runProcess();
  });
});
threshold.addEventListener('change', () => {
  if (srcCanvas.width > 0) runProcess();
});
</script>
</body>
</html>
